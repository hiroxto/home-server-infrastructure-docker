name: Build check Docker images

on:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-slim
    outputs:
      epgstation: ${{ steps.filter.outputs.epgstation }}
      mirakurun: ${{ steps.filter.outputs.mirakurun }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            epgstation:
              - src/epgstation/**
            mirakurun:
              - src/mirakurun/**

  epgstation:
    needs:
      - changes
    if: needs.changes.outputs.epgstation == 'true'
    uses: ./.github/workflows/build-check.yml
    with:
      context: ./src/epgstation

  mirakurun:
    needs:
      - changes
    if: needs.changes.outputs.mirakurun == 'true'
    uses: ./.github/workflows/build-check.yml
    with:
      context: ./src/mirakurun

  build-results:
    needs:
      - changes
      - epgstation
      - mirakurun
    if: always()
    runs-on: ubuntu-slim
    steps:
      - name: Check build results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          EPGSTATION_CHANGED: ${{ needs.changes.outputs.epgstation }}
          EPGSTATION_RESULT: ${{ needs.epgstation.result }}
          MIRAKURUN_CHANGED: ${{ needs.changes.outputs.mirakurun }}
          MIRAKURUN_RESULT: ${{ needs.mirakurun.result }}
        run: |
          if [ "$CHANGES_RESULT" != 'success' ]; then
            echo "::error::Change detection did not succeed: $CHANGES_RESULT"
            exit 1
          fi

          case "$EPGSTATION_CHANGED:$EPGSTATION_RESULT" in
            true:success|false:skipped) ;;
            *)
              echo "::error::EPGStation: changed=$EPGSTATION_CHANGED, result=$EPGSTATION_RESULT"
              exit 1
              ;;
          esac

          case "$MIRAKURUN_CHANGED:$MIRAKURUN_RESULT" in
            true:success|false:skipped) ;;
            *)
              echo "::error::Mirakurun: changed=$MIRAKURUN_CHANGED, result=$MIRAKURUN_RESULT"
              exit 1
              ;;
          esac
